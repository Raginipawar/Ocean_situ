[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "varuna-streaming-nowcast"
version = "0.1.0"
description = "VARUNA (SIH26067) Streaming Backbone + Nowcast Engine -- Person 3 / Intelligence Core #3 (stretch)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "pydantic>=2.6",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Only needed once Person 6's real /observations feed is up and the mock
# stream is swapped for an HTTP adapter (Day 3) -- see README section 9.
day3 = ["httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
