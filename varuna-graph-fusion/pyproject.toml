[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "varuna-graph-fusion"
version = "0.1.0"
description = "VARUNA (SIH26067) Graph Fusion Engine -- Person 1 / Intelligence Core #1"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "networkx>=3.2",
    "pandas>=2.1",
    "torch>=2.2",
    "torch_geometric>=2.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
