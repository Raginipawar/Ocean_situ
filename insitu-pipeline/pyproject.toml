[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "varuna-insitu-pipeline"
version = "0.1.0"
description = "VARUNA In-Situ Ocean Observation Data Pipeline and Extensible Adapter Pattern (SIH26067)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.28",
]

[project.optional-dependencies]
netcdf = [
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "scipy>=1.11",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
